version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "cargo"
    directory: "/keyless-rust"
    schedule:
      interval: monthly

  - package-ecosystem: "pip"
    directory: "/keyless-python"
    schedule:
      interval: monthly

  - package-ecosystem: "npm"
    directory: "/keyless-ts"
    schedule:
      interval: monthly
