name: check-ts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
  # Lets the publish workflow re-run the full check suite on the tagged commit
  # instead of duplicating (and drifting from) these steps inline.
  workflow_call:

permissions:
  contents: read

jobs:
  ts-checks:
    concurrency:
      group: ts-checks-${{ github.ref }}-${{ matrix.node_version }}
      # Cancel superseded runs on PR branches, but never on main: a cancelled main
      # run would leave a commit with no completed status.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One failing Node version must not cancel the others: a version-specific break and
      # a break on every version look identical when the surviving legs never report.
      fail-fast: false
      matrix:
        # Exercise the declared floor exactly so dependency floor drift cannot hide
        # behind the newest patch release, plus the current LTS line.
        node_version: ["22.13.0", "24"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: keyless-ts/package-lock.json
      - name: Run reusable TypeScript checks
        run: python3 .github/scripts/run_checks.py ts

      - name: Audit dependencies
        # Covers production and development dependencies at once; a separate
        # `--omit=dev` run could never fail without this one failing too.
        run: |
          cd keyless-ts
          npm audit --audit-level=moderate

      - name: Check package contents
        # Check the exact tarball allowlist, not only broad permitted prefixes. Pack once
        # here and reuse the tarball path (via $GITHUB_ENV) in the later steps.
        run: |
          cd keyless-ts
          TARBALL="$PWD/$(npm pack --silent)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          npm run check-package -- "$TARBALL"

      - name: Module interop smoke test (require and import)
        # Prove the CommonJS and native ESM entry points against the packed tarball.
        run: |
          mkdir -p /tmp/interop-smoke && cd /tmp/interop-smoke
          npm init -y > /dev/null
          # Recorded in package.json on purpose: a later `npm install` in this same
          # directory (the TypeScript consumer step below) prunes anything that is not,
          # and the step after it would then be type-checking against nothing.
          npm install "$TARBALL"
          node --input-type=commonjs -e "
          const { appAgentId, encodeAppAgentAddress, decodeAddress, encodeAddress, Ss58Error } = require('@trevofinance/trevokeyless');
          const address = encodeAppAgentAddress({ appAgentId: appAgentId(123) });
          if (address !== 'ttowKp8AmQuGfbBGikG2pbdYNnErhHRaLrdktJeZEfJVeVnTp') process.exit(1);
          if (encodeAddress(decodeAddress(address).accountId) !== address) process.exit(1);
          if (typeof Ss58Error !== 'function') process.exit(1);
          console.log('require interop OK');
          "
          node --input-type=module -e "
          import { appAgentId, encodeAppAgentAddress, decodeAddress, encodeAddress, Ss58Error } from '@trevofinance/trevokeyless';
          const address = encodeAppAgentAddress({ appAgentId: appAgentId(123) });
          if (address !== 'ttowKp8AmQuGfbBGikG2pbdYNnErhHRaLrdktJeZEfJVeVnTp') process.exit(1);
          if (encodeAddress(decodeAddress(address).accountId) !== address) process.exit(1);
          if (typeof Ss58Error !== 'function') process.exit(1);
          console.log('import interop OK');
          "

      - name: TypeScript consumer resolves types under both module systems
        # `npm run type-check` compiles the package's own sources with node10 resolution and
        # can never see this: the exports map must offer a *CommonJS* .d.ts to `require`
        # consumers. Pointing them at the ESM declarations (inside dist/esm, which is marked
        # `type: module`) makes tsc reject the package with TS1479 under module: node16 —
        # the modern default — while every test here still passes.
        run: |
          cd /tmp/interop-smoke
          npm install typescript@5
          cat > tsconfig.json <<'JSON'
          {"compilerOptions":{"module":"node16","moduleResolution":"node16","strict":true,"noEmit":true,"target":"ES2022"}}
          JSON
          cat > use.mts <<'TS'
          import { appAgentId, encodeAppAgentAddress } from "@trevofinance/trevokeyless";
          export const address: string = encodeAppAgentAddress({ appAgentId: appAgentId(1) });
          TS
          cp use.mts use.cts
          npx tsc -p tsconfig.json

      - name: Browser and React Native artifact resolver tests
        run: |
          node "$GITHUB_WORKSPACE/keyless-ts/scripts/check-platforms.mjs" --resolver-only /tmp/interop-smoke

      - name: Install current Chromium
        if: matrix.node_version == '24'
        working-directory: keyless-ts
        run: npx playwright install --with-deps chromium

      - name: Browser and Hermes runtime tests
        if: matrix.node_version == '24'
        run: |
          node "$GITHUB_WORKSPACE/keyless-ts/scripts/check-platforms.mjs" --runtime /tmp/interop-smoke

      - name: README examples run against the packed tarball
        # The Rust README is compiled as a doctest; this is the TypeScript
        # equivalent. Every README example executes against the tarball installed by
        # the interop smoke test above, so a drifting example (or address) fails CI.
        run: |
          cd /tmp/interop-smoke
          node "$GITHUB_WORKSPACE/keyless-ts/scripts/run-readme.mjs" "$GITHUB_WORKSPACE/keyless-ts/README.md"

  windows-package-smoke:
    concurrency:
      group: ts-windows-package-smoke-${{ github.ref }}
      # Cancel superseded runs on PR branches, but never on main: a cancelled main
      # run would leave a commit with no completed status.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Use Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: keyless-ts/package-lock.json
      - name: Build, pack, and run Hermes on Windows
        working-directory: keyless-ts
        # `shell: bash`, not the Windows default pwsh: pwsh does not abort on a failing
        # *native* command mid-script (only the last exit code propagates), so a failed
        # resolver or Hermes check would be masked by the pack/allowlist commands
        # succeeding afterwards. bash runs with `-eo pipefail` and stops at the failure.
        shell: bash
        run: |
          npm ci
          npm run build
          npm run check-platform-resolvers
          node scripts/check-platforms.mjs --runtime --hermes-only
          tarball="$(npm pack --silent)"
          node scripts/check-package.mjs "$tarball"
