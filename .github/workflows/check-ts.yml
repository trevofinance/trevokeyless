name: check-ts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ts-checks:
    concurrency:
      group: ts-checks-${{ github.ref }}-${{ matrix.node_version }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Active LTS versions (Node 20 reached end of life in April 2026).
        node_version: [22, 24]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node_version }}
      - run: |
          cd keyless-ts
          npm ci
          npm run format-check
          npm run lint-check
          npm run build
          npm run test

      - name: Audit production dependencies
        run: |
          cd keyless-ts
          npm audit --omit=dev --audit-level=high

      - name: Check package contents
        # The "files" allowlist is release-critical; verify the packed tarball instead
        # of trusting the configuration.
        run: |
          cd keyless-ts
          npm pack --dry-run --json > /tmp/pack-report.json
          node -e "
          const files = require('/tmp/pack-report.json')[0].files.map((f) => f.path);
          const allowed = (f) => f.startsWith('dist/') || ['package.json', 'README.md', 'LICENSE'].includes(f);
          if (files.length === 0 || !files.every(allowed)) { console.error('unexpected package contents:', files); process.exit(1); }
          console.log('npm package contents OK:', files.length, 'files');
          "

      - name: Module interop smoke test (require and import)
        # The package deliberately ships a single CommonJS build; the README promises
        # it works from both require and ESM import (named imports resolve via Node's
        # CJS interop). Prove the promise against the packed tarball, not src/.
        run: |
          cd keyless-ts
          TARBALL="$PWD/$(npm pack --silent)"
          mkdir -p /tmp/interop-smoke && cd /tmp/interop-smoke
          npm init -y > /dev/null
          npm install --no-save "$TARBALL"
          node --input-type=commonjs -e "
          const { encodeAppAgentAddress, decodeAddress, encodeAddress, Ss58Error } = require('@trevofinance/trevokeyless');
          const address = encodeAppAgentAddress(123);
          if (address !== 'ttowKp8AmQuGfbBGikG2pbdYNnErhHRaLrdktJeZEfJVeVnTp') process.exit(1);
          if (encodeAddress(decodeAddress(address).accountId) !== address) process.exit(1);
          if (typeof Ss58Error !== 'function') process.exit(1);
          console.log('require interop OK');
          "
          node --input-type=module -e "
          import { encodeAppAgentAddress, decodeAddress, encodeAddress, Ss58Error } from '@trevofinance/trevokeyless';
          const address = encodeAppAgentAddress(123);
          if (address !== 'ttowKp8AmQuGfbBGikG2pbdYNnErhHRaLrdktJeZEfJVeVnTp') process.exit(1);
          if (encodeAddress(decodeAddress(address).accountId) !== address) process.exit(1);
          if (typeof Ss58Error !== 'function') process.exit(1);
          console.log('import interop OK');
          "

      - name: README examples run against the packed tarball
        # The Rust README is compiled as a doctest; this is the TypeScript
        # equivalent. Every README example executes against the tarball installed by
        # the interop smoke test above, so a drifting example (or address) fails CI.
        run: |
          cd /tmp/interop-smoke
          node "$GITHUB_WORKSPACE/keyless-ts/scripts/run-readme.mjs" "$GITHUB_WORKSPACE/keyless-ts/README.md"
