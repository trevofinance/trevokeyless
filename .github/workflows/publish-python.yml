# Publishes the trevokeyless package to PyPI on a `python-vX.Y.Z` tag.
#
# One-time registry setup (no API token is stored): on PyPI, configure a Trusted
# Publisher for the project with repository `trevo-finance/trevokeyless`, workflow
# `publish-python.yml`, and environment `release`.
name: publish-python

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

# Never publish two releases of the same package concurrently, and never cancel a publish
# in flight: two tags pushed back-to-back must queue at the registry, not race.
concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the ancestry check below needs to walk back to main.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The interpreter the hash-pinned lock was compiled with. Read from
          # keyless-python/.python-version like the check-python jobs, so a future
          # interpreter bump cannot leave release builds behind.
          python-version-file: keyless-python/.python-version
          cache: pip
          cache-dependency-path: keyless-python/requirements-dev.txt

      - name: Tagged commit must be on main
        # The publish trigger is a tag push, and a tag can point at *any* commit. Without
        # this, anyone able to push a tag could publish unreviewed code under the
        # repository's trusted-publishing identity.
        run: |
          # origin/main comes from the fetch-depth: 0 checkout above, which fetches every
          # branch. Do not fetch here: the checkout strips its credentials afterwards
          # (persist-credentials: false), so a fetch at this point runs unauthenticated
          # and fails on a private repository.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main. Release tags must be pushed on commits merged to main." >&2
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

      - name: Tag must match the package version
        run: |
          cd keyless-python
          tag_version="${GITHUB_REF_NAME#python-v}"
          pkg_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag_version" = "$pkg_version" || { echo "tag $tag_version != pyproject $pkg_version"; exit 1; }

      - name: Build and validate
        run: |
          cd keyless-python
          python -m pip install --require-hashes -r requirements-dev.txt
          python3 -m build --no-isolation
          twine check --strict dist/*

      - name: Check artifact contents
        # Assert against the exact artifacts that will be uploaded to PyPI, with the
        # same script the PR gate (check-python.yml) runs.
        run: |
          cd keyless-python
          python3 ../.github/scripts/check_python_artifacts.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: keyless-python/dist/

  # Re-run the full check suite on the tagged commit: a tag can point at any commit,
  # not necessarily one that passed check-python on a PR.
  checks:
    uses: ./.github/workflows/check-python.yml

  docs:
    uses: ./.github/workflows/check-docs.yml

  # Part of "the full check suite": this package must still agree with the Rust source of
  # truth on the tagged commit.
  cross-language:
    # The called workflow's job requests `issues: write` (its scheduled runs file an issue
    # on failure). A called workflow can only downgrade the caller's GITHUB_TOKEN, never
    # elevate it, so the grant must be repeated here — without it GitHub refuses to start
    # the nested job ("requesting 'issues: write', but is only allowed 'issues: none'")
    # and this gate blocks every publish. The issue-filing step itself is schedule-only
    # and never runs on the tag path.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/check-cross-language.yml

  publish:
    needs: [build, checks, docs, cross-language]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
