# Publishes the trevokeyless package to PyPI on a `python-vX.Y.Z` tag.
#
# One-time registry setup (no API token is stored): on PyPI, configure a Trusted
# Publisher for the project with repository `trevo-finance/trevo-keyless`, workflow
# `publish-python.yml`, and environment `release`.
name: publish-python

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          cd keyless-python
          tag_version="${GITHUB_REF_NAME#python-v}"
          pkg_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag_version" = "$pkg_version" || { echo "tag $tag_version != pyproject $pkg_version"; exit 1; }

      - name: Run tests
        run: |
          cd keyless-python
          pip install .[dev]
          python3 -m unittest discover

      - name: Build and validate
        run: |
          cd keyless-python
          pip install --upgrade build twine packaging
          python3 -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: keyless-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
