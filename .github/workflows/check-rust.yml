name: check-rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

  workflow_dispatch:

jobs:
  rust-checks:
    concurrency:
      group: rust-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./keyless-rust
    steps:
      - uses: actions/checkout@v6
      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run test suite (all features)
        run: cargo test --all-features

      - name: Run test suite (no default features)
        run: cargo test --no-default-features

      - name: Conformance fixture is up to date
        run: cargo run --example gen_conformance --features ss58 | diff - ../conformance/vectors.json

      - name: Build no_std (wasm32v1-none, ss58 + serde)
        run: cargo build --target wasm32v1-none --no-default-features --features ss58,serde

      - name: Docs (all features)
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Publish dry run
        run: cargo publish --dry-run

  rust-msrv:
    concurrency:
      group: rust-msrv-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./keyless-rust
    steps:
      - uses: actions/checkout@v6
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0
      - name: Check (all features) on MSRV
        run: cargo check --all-features

  rust-fuzz:
    concurrency:
      group: rust-fuzz-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./keyless-rust
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the SS58 decoder (smoke run)
        run: cargo +nightly fuzz run ss58_decode -- -max_total_time=60

  rust-audit:
    concurrency:
      group: rust-audit-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./keyless-rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies against the RustSec database
        run: cargo audit
