# Publishes the trevokeyless crate to crates.io on a `rust-vX.Y.Z` tag.
#
# One-time registry setup (no long-lived token is stored): on crates.io, configure a
# Trusted Publisher for the crate with repository `trevo-finance/trevo-keyless` and
# workflow `publish-rust.yml`; the job exchanges a GitHub OIDC token for a scoped
# temporary publish token.
name: publish-rust

on:
  push:
    tags: ['rust-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./keyless-rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy

      - name: Tag must match the crate version
        run: |
          tag_version="${GITHUB_REF_NAME#rust-v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$tag_version" = "$crate_version" || { echo "tag $tag_version != Cargo.toml $crate_version"; exit 1; }

      # Re-run the release-critical gates on the tagged commit: a tag can point at any
      # commit, not necessarily one that passed check-rust on a PR.
      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run test suite (all features)
        run: cargo test --all-features

      - name: Run test suite (no default features)
        run: cargo test --no-default-features

      - name: Conformance fixture is up to date
        run: cargo run --example gen_conformance --features ss58 | diff - ../conformance/vectors.json

      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
