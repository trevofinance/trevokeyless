# Publishes the trevokeyless crate to crates.io on a `rust-vX.Y.Z` tag.
#
# One-time registry setup (no long-lived token is stored): on crates.io, configure a
# Trusted Publisher for the crate with repository `trevo-finance/trevo-keyless` and
# workflow `publish-rust.yml`; the job exchanges a GitHub OIDC token for a scoped
# temporary publish token.
name: publish-rust

on:
  push:
    tags: ['rust-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./keyless-rust
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Tag must match the crate version
        run: |
          tag_version="${GITHUB_REF_NAME#rust-v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$tag_version" = "$crate_version" || { echo "tag $tag_version != Cargo.toml $crate_version"; exit 1; }

      - name: Run test suite (all features)
        run: cargo test --all-features

      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
