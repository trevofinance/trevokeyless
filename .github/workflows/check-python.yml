name: check-python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  python-checks:
    concurrency:
      group: python-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.3

      - name: Install deps
        run: |
            cd keyless-python
            pip install .[test]

      - name: Check code formatting with ruff
        run: |
            cd keyless-python
            ruff format --check

      - name: Check code with ruff
        run: |
            cd keyless-python
            ruff check

      - name: Check code with mypy
        run: |
            cd keyless-python
            mypy trevokeyless

      - name: Run tests
        run: |
            cd keyless-python
            python3 -m unittest tests.test_encoding tests.test_ss58 tests.test_names
