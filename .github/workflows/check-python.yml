name: check-python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  python-checks:
    concurrency:
      group: python-checks-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported version (requires-python >= 3.10) and a current one.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
            cd keyless-python
            pip install .[test]

      - name: Check code formatting with ruff
        run: |
            cd keyless-python
            ruff format --check

      - name: Check code with ruff
        run: |
            cd keyless-python
            ruff check

      - name: Check code with mypy
        run: |
            cd keyless-python
            mypy trevokeyless

      - name: Run tests
        # Discovery picks up every tests/test_*.py module; the previous explicit module
        # list silently skipped test_adversarial.py.
        run: |
            cd keyless-python
            python3 -m unittest discover --verbose
