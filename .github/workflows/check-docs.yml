name: check-docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  stale-symbols:
    concurrency:
      group: stale-symbols-${{ github.ref }}
      # Cancel superseded runs on PR branches, but never on main: a cancelled main
      # run would leave a commit with no completed status.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The repository-root rust-toolchain.toml would otherwise override the toolchain
      # installed below; RUSTUP_TOOLCHAIN takes precedence over that file. The release
      # metadata check shells out to cargo (conformance fixture freshness).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: keyless-rust

      - name: No references to stale renamed symbols (outside changelogs)
        # Changelogs retain rename history, and this workflow names the dead symbols in its
        # own pattern/comment; exclude only those from the live-documentation search. Every
        # other file in the tree — reports included — is held to the current names.
        #
        # git grep exits 1 for "no matches" but >=2 for an error (a bad pattern or a
        # pathspec typo after a future edit); a plain `if` folds both into the passing
        # branch, turning the gate silently green forever. Tell the two apart.
        run: |
          set +e
          git grep -nE 'AddressType|BlockchainAddressInfo|DecodedTransactionalAccount|DecodedNamedAccount' -- ':!*CHANGELOG.md' ':!.github/workflows/check-docs.yml'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Found references to pre-1.0 renamed symbols. Use AccountType / AccountTypeMismatchError / BlockchainAccountInfo (old names allowed only in changelogs)." >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep itself failed with status $status (bad pattern or pathspec?)" >&2
            exit "$status"
          fi
          echo "No stale renamed-symbol references found."

      - name: Provider-neutral AI configuration topology
        run: python3 .github/scripts/check_ai_config.py --scope core

      - name: Canonical documentation topology
        run: |
          for file in CODE_OF_CONDUCT.md CONTRIBUTING.md RELEASING.md SECURITY.md; do
            if [ -e "$file" ]; then
              echo "::error file=$file::Canonical repository documentation belongs under docs/" >&2
              exit 1
            fi
          done

          set +e
          git grep -nE 'conformance/README\.md|trevokeyless#security-model|blob/main/CONTRIBUTING\.md' -- ':!.github/workflows/check-docs.yml'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Found a reference to a retired canonical documentation location." >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep for retired documentation locations failed with status $status." >&2
            exit "$status"
          fi
          echo "Canonical documentation topology is valid."

      - name: Agent Skills conform to the open standard
        env:
          SKILLS_REF_COMMIT: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
        run: |
          validator="$RUNNER_TEMP/skills-ref"
          python3 -m venv "$validator"
          "$validator/bin/pip" install --quiet "git+https://github.com/agentskills/agentskills@$SKILLS_REF_COMMIT#subdirectory=skills-ref"
          for skill_dir in .agents/skills/*; do
            [ -d "$skill_dir" ] || continue
            "$validator/bin/skills-ref" validate "$skill_dir"
          done

      - name: Release metadata is synchronized
        run: python3 .github/scripts/release_metadata.py

      - name: Repository helper tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' --verbose

  link-check:
    concurrency:
      group: link-check-${{ github.ref }}
      # Cancel superseded runs on PR branches, but never on main: a cancelled main
      # run would leave a commit with no completed status.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check links in Markdown files
        # lychee respects .gitignore by default, so build output (node_modules, dist,
        # target) is never scanned.
        #
        # www.npmjs.com answers datacenter traffic with 403 Forbidden regardless of the
        # package existing, so the only two outcomes it can produce here are a false
        # failure and a false failure after a retry. The registry links for the other two
        # packages (crates.io, pypi.org) are still checked for real.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 2
            --exclude '^https://www\.npmjs\.com/'
            './**/*.md'
          fail: true
        env:
          # Authenticated requests keep github.com link checks from tripping the
          # anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
