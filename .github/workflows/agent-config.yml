name: Agent configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Core and installed adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check neutral core, adapters, isolation, and secrets
        run: python3 .github/scripts/check_ai_config.py --scope all

      - name: Neutral validator regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' --verbose

      - name: Claude adapter regression tests
        run: |
          python3 .claude/check_adapter.py
          python3 -m unittest discover -s .claude -p 'test_*.py' --verbose

      - name: Codex adapter regression tests
        run: |
          python3 .codex/check_adapter.py
          python3 -m unittest discover -s .codex -p 'test_*.py' --verbose

      - name: Gemini adapter regression tests
        run: |
          python3 .gemini/check_adapter.py
          python3 -m unittest discover -s .gemini -p 'test_*.py' --verbose
