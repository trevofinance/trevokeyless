name: check-python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    concurrency:
      group: python-checks-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported version (requires-python >= 3.10) through current stable.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
            cd keyless-python
            pip install .[dev]

      - name: Audit dependencies
        run: |
            cd keyless-python
            pip install pip-audit
            pip-audit

      - name: Check code formatting with ruff
        run: |
            cd keyless-python
            ruff format --check

      - name: Check code with ruff
        run: |
            cd keyless-python
            ruff check

      - name: Check code with mypy
        run: |
            cd keyless-python
            mypy trevokeyless

      - name: Run tests
        # Discovery picks up every tests/test_*.py module; the previous explicit module
        # list silently skipped test_adversarial.py.
        run: |
            cd keyless-python
            python3 -m unittest discover --verbose

      - name: Build and validate distribution artifacts
        run: |
            cd keyless-python
            pip install --upgrade build twine packaging
            python3 -m build
            twine check --strict dist/*

      - name: Check artifact contents
        # The MANIFEST.in pruning and the package-data globs are release-critical;
        # verify the built artifacts instead of trusting the configuration.
        run: |
            cd keyless-python
            python3 - <<'EOF'
            import glob, tarfile, zipfile

            [whl] = glob.glob("dist/*.whl")
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.endswith("trevokeyless/py.typed") for n in names), names
            assert not any("tests/" in n for n in names), names
            assert not any(n.endswith(".pyi") for n in names), names

            [sdist] = glob.glob("dist/*.tar.gz")
            tnames = tarfile.open(sdist).getnames()
            assert not any("/tests/" in n for n in tnames), tnames
            print("wheel:", len(names), "entries; sdist:", len(tnames), "entries - OK")
            EOF
