# Steers vulnerability reports away from public issues, reinforcing docs/SECURITY.md.
# Ordinary blank issues stay enabled: the repository's own automation
# (report_scheduled_failure.sh, publish-watch) files plain issues.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability (privately)
    url: https://github.com/trevo-finance/trevokeyless/security/advisories/new
    about: >-
      Please do not open a public issue for suspected vulnerabilities. Use GitHub's
      private vulnerability reporting here, or email support@trevo.finance — see
      docs/SECURITY.md for the policy and response times.
