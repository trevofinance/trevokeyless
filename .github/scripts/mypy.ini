# Type-checking configuration for the release-critical CI helper scripts in this
# directory (the keyless-python mypy run only covers the package itself). Used as
#   mypy --config-file .github/scripts/mypy.ini .github/scripts
# from the repository root, with the trevokeyless package installed (check_cross_language
# imports it).
[mypy]
python_version = 3.12
strict = True
