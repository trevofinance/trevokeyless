[project]
name = "trevokeyless"
version = "2.0.0"
requires-python = ">=3.10"

license = "Apache-2.0"
authors = [
  { name="Trevo Ltd", email="support@trevo.finance" },
]
description = "Encoding, decoding, and classification of Trevo keyless addresses: application agent, transactional, and named."
readme = "README.md"
keywords = ["trevo", "blockchain", "substrate", "ss58", "keyless", "address"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

# Zero runtime dependencies: the strict base58 codec is vendored in
# trevokeyless._ss58 (the SS58 payloads are at most 36 bytes).
dependencies = []

# No [project.optional-dependencies]: the development toolchain lives in
# requirements-dev.in / requirements-dev.txt (exact, hash-pinned, what CI installs). A
# `dev` extra here would be metadata that nothing installs, with floors that drift from
# the lock, shipped in the wheel's METADATA.


[project.urls]
Homepage = "https://trevo.finance"
Repository = "https://github.com/trevo-finance/trevokeyless.git"
Issues = "https://github.com/trevo-finance/trevokeyless/issues"


[build-system]
# >=77: first release that supports the PEP 639 SPDX string in `project.license`
# (and ships the LICENSE file via the default `license-files` globs).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = ["trevokeyless"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["py.typed"]


[tool.ruff]
target-version = "py310"
line-length = 120
fix = false
exclude = [
    ".venv",
    "venv",
    ".env",
    "env",
]

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "DTZ", "EM", "FA", "ISC", "PIE", "T20", "PYI", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "INT", "ARG", "PTH", "TD", "FIX", "PL", "TRY", "RUF"]
ignore = ["COM812", "UP040"]
fixable = ["ALL"]


[tool.mypy]
python_version = "3.10"
strict = true
# `python -m build` copies the package into build/, which would otherwise be
# picked up as a duplicate module.
exclude = ["build"]
