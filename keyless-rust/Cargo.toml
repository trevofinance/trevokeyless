[package]
name = "trevokeyless"
version = "2.0.0"
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "Encoding, decoding, and classification of Trevo keyless accounts: application agent, transactional, and named."
homepage = "https://trevo.finance"
repository = "https://github.com/trevo-finance/trevokeyless/"
readme = "README.md"
keywords = ["trevo", "blockchain", "substrate", "no-std", "scale"]
categories = ["encoding", "wasm"]
# Publish only the product and consumer documentation. Repository AI configuration, the
# fuzzing harness, and the differential-check driver have no meaning outside this repository
# and remain excluded without a provider-specific filename list.
include = [
    "src/**/*",
    "examples/gen_conformance.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[lints.rust]
missing_docs = "deny"

[package.metadata.docs.rs]
all-features = true
# Enables the `doc_cfg` annotations in the source, so docs.rs labels each feature-gated item
# with the feature that provides it. Without this, roughly half the public surface (the whole
# SS58 codec, AccountId64/AccountId128, the SCALE and serde impls) renders as if it were
# always available, and users hit "no method named `to_ss58check`" after adding the crate.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = [
    "blake2b_simd/std",
    "bs58?/std",
    "parity-scale-codec?/std",
    "scale-info?/std",
    "serde?/std",
]
# SS58 address encoding/decoding for `AccountId32` (requires an allocator).
ss58 = ["dep:bs58"]
# SCALE codec and metadata support (Encode/Decode/DecodeWithMemTracking/TypeInfo/
# MaxEncodedLen for every public type), for direct use inside a Substrate runtime.
scale = ["dep:parity-scale-codec", "dep:scale-info"]
# Serde support: `AccountId32` (de)serializes as an SS58 string, `AccountName` as a string.
#
# The `ss58` implication is PERMANENT, not a convenience to unbundle later: the
# human-readable representation is *defined* as the SS58 address, so a `serde` without
# `ss58` could only fall back to some other text form (hex, say) — and because Cargo
# unifies features across the dependency graph, enabling `ss58` anywhere would then
# silently flip every other consumer's JSON wire format from hex to SS58. A binary-only
# serde consumer (bincode/postcard) pays the bs58 compile time for that stability;
# that trade-off is deliberate and signed off.
serde = ["dep:serde", "ss58"]
# Opaque fixed-width account ids (`AccountId64`, `AccountId128`) for Substrate runtime tests
# that instantiate `frame_system::Config::AccountId` at widths other than 32 bytes. A keyless
# account is carried in the leading 32 bytes (right-zero-padded); the wide types reuse the
# 32-byte codec via pad/unpad conversions. No SS58, no cross-language counterpart. Off by
# default; combine with `scale` (and `serde`) for the trait impls such a runtime requires.
test-accounts = []

[dependencies]
blake2b_simd = { version = "1.0.2", default-features = false }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"], optional = true }
# `derive` is requested explicitly: `max-encoded-len` activates the derive crate only
# weakly (`parity-scale-codec-derive?/max-encoded-len`), so without this the Encode/Decode/
# MaxEncodedLen derive macros reach us only via scale-info's own `derive` feature — an
# accident that any upstream change would turn into a build failure.
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"], optional = true }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"], optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
array-bytes = { version = "9.3.0", default-features = true }
serde_json = { version = "1.0", default-features = true }
serde_test = "1.0.177"

# Generates the cross-language conformance fixture `conformance/vectors.json` consumed by
# the Rust, Python, and TypeScript test suites.
[[example]]
name = "gen_conformance"
required-features = ["ss58"]

[[example]]
name = "differential"
required-features = ["ss58"]
